services:  
  export_import_entities.export.entites:
    class: Drupal\export_import_entities\Services\ExportEntities
    arguments: ['@entity_field.manager','@config.storage','@export_import_entities.export.form.displays','@export_import_entities.export.form.LoadConfigs','@export_import_entities.export.view.displays']
  
  plugin.manager.import_content:
    class: Drupal\export_import_entities\ImportContentsPluginManager
    arguments: ['@container.namespaces', '@cache.default', '@module_handler']
    
  export_import_entities.export.form.displays:
    class: Drupal\export_import_entities\Services\LoadFormDisplays
    arguments: ['@export_import_entities.export.form.LoadConfigs','@export_import_entities.export.third_party_settings']
    
  export_import_entities.export.view.displays:
    class: Drupal\export_import_entities\Services\LoadViewDisplays
    arguments: ['@export_import_entities.export.form.LoadConfigs','@export_import_entities.export.third_party_settings']
    
  export_import_entities.export.form.write:
    class: Drupal\export_import_entities\Services\LoadFormWrite
    arguments: ['@export_import_entities.export.form.LoadConfigs','@export_import_entities.export.third_party_settings']
    
  export_import_entities.export.form.LoadConfigs:
    class: Drupal\export_import_entities\Services\LoadConfigs
    arguments: ['@config.storage','@extension.path.resolver']
    
  export_import_entities.export.third_party_settings:
    class: Drupal\export_import_entities\Services\ThirdPartySettings
    arguments: ['@export_import_entities.export.form.LoadConfigs']  
    
  export_import_entities.clean_configs_theme:
    class: Drupal\export_import_entities\Services\CleanConfigsTheme
    arguments: ['@extension.path.resolver','@asset.css.collection_optimizer','@theme_handler','@config.manager','@config.factory','@module_handler','@router.builder','@extension.list.theme']

  export_import_entities.import_config_custom:
    class: Drupal\export_import_entities\Services\ConfigImportCustom
    arguments: ['@entity_type.manager','@config.storage','@renderer','@event_dispatcher','@config.manager','@lock.persistent','@config.typed','@module_installer','@theme_handler','@extension.list.module','@extension.list.theme','@messenger']
