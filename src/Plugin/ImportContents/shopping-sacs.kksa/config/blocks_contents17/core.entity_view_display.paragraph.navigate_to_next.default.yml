          scss:
            scss_field: "  position: relative;\r\n  z-index: 10;\r\n  $rayon: $wbu-margin * 2.8;\r\n  .navigate-next {\r\n    border-radius: 50%;\r\n    box-shadow: 0 0.125rem 0.625rem rgb(28 28 28 / 0.15);\r\n    width: $rayon;\r\n    height: $rayon;\r\n    padding: 0;\r\n    margin-top: -$rayon * 0.5;\r\n    .icon {\r\n      height: auto;\r\n      transition: transform 0.2s;\r\n      display: block;\r\n    }\r\n    &:hover svg {\r\n      animation: 0.35s ease-in-out forwards animateIconBlock;\r\n    }\r\n  }\r\n  @keyframes animateIconBlock {\r\n    0% {\r\n      opacity: 1;\r\n      transform: translateY(0%);\r\n    }\r\n\r\n    50% {\r\n      opacity: 0;\r\n      transform: translateY(100%);\r\n    }\r\n\r\n    51% {\r\n      opacity: 0;\r\n      transform: translateY(-100%);\r\n    }\r\n\r\n    100% {\r\n      opacity: 1;\r\n      transform: translateY(0%);\r\n    }\r\n  }"
            file_js: "Drupal.behaviors.paragraph_navigate_to_next = {\r\n    attach: function (context, settings) {\r\n      if (context.querySelectorAll && context.querySelectorAll('[data-action=\"navigate-next\"]')) {\r\n        once(\"paragraph_navigate_to_next\", '[data-action=\"navigate-next\"]', context).forEach((scrollToTopBtn) => {\r\n          scrollToTopBtn.addEventListener(\"click\", function () {\r\n            // Obtenir la position du bouton par rapport au haut de la page\r\n            const buttonPosition = scrollToTopBtn.getBoundingClientRect().top + window.scrollY;\r\n            window.scrollTo({\r\n              top: buttonPosition,\r\n              behavior: \"smooth\", // Pour un défilement fluide\r\n            });\r\n          });\r\n        });\r\n      }\r\n    },\r\n  };"
