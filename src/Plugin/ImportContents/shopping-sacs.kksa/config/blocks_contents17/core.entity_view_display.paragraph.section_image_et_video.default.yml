          scss:
            scss_field: "svg{\r\n  width: 20px;\r\nheight: 20px;\r\n  fill: #aa745d;\r\n}\r\n\r\n.custom-text{\r\n  letter-spacing: 2px\r\n}"
            file_js: "Drupal.behaviors.paragraph_navigate_to_next = {\r\nattach: function (context, settings) {\r\n// On se rassure que l'élément est présent dans le contexte.\r\nif (context.querySelectorAll && context.querySelectorAll('.video-button')) {\r\n// On se rassure que l'élément est lu une seule fois.\r\nonce(\"paragraph_navigate_to_next\", '.video-button', context).forEach((videoButton) => {\r\nconsole.log(\"paragraph_navigate_to_next :\", videoButton);\r\n\r\n// Ajouter un écouteur d'événement pour le clic sur le bouton\r\nvideoButton.addEventListener('click', function() {\r\n// Créer un élément vidéo\r\nvar videoElement = document.createElement('video');\r\nvideoElement.src = '<iframe width=\"1280\" height=\"720\" src=\"https://www.youtube.com/embed/aWIWe7alFno?list=RDEM6O3VVkKZuDIGssQoM9jO2A\" title=\"Beyoncé - Halo (LYRICS)\" frameborder=\"0\" allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share\" referrerpolicy=\"strict-origin-when-cross-origin\" allowfullscreen></iframe>'; // Remplacez par l'URL de votre vidéo\r\nvideoElement.controls = true;\r\nvideoElement.autoplay = true;\r\nvideoElement.style.width = '100%'; // Ajustez la taille selon vos besoins\r\n\r\n// Ajouter l'élément vidéo au DOM\r\ndocument.body.appendChild(videoElement);\r\n});\r\n});\r\n}\r\n},\r\n};"
