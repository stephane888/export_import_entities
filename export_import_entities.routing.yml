route_callbacks:
  - '\Drupal\export_import_entities\Routing\DynamicRoutes::routes'
  
export_import_entities.current_export:
  path: '/export-import-entities/current-export'
  defaults:
    _title: 'Get current export'
    _controller: '\Drupal\export_import_entities\Controller\ExportImportEntitiesController::build'
  requirements:
    _permission: 'access content'
    _role: 'gerant_de_site_web+administrator'
    
export_import_entities.clean_configs:
  path: '/admin/config/development/export-import-entities/clean-config'
  defaults:
    _title: 'Clean config for a theme'
    _form: 'Drupal\export_import_entities\Form\CleanConfigsThemeForm'
  requirements:
    _permission: 'administer export_import_entities configuration'
    
export_import_entities.downloadsitezip:
  path: '/export-import-entities/downloadsitezip/{domaineId}'
  defaults:
    _title: 'Download site zip'
    _controller: '\Drupal\export_import_entities\Controller\ExportImportEntitiesController::DownloadSiteZip'
  requirements:
    _permission: 'access content'
    _role: 'gerant_de_site_web+administrator'

export_import_entities.settings_form:
  path: '/admin/config/system/export-import-entities'
  defaults:
    _title: 'Export Import Entities settings'
    _form: 'Drupal\export_import_entities\Form\SettingsForm'
  requirements:
    _permission: 'administer export_import_entities configuration'
    
export_import_entities.generatesite:
  path: '/export-import-entities/generate-site/{domaineId}'
  defaults:
    _title: 'Generer les données pour votre site'
    _form: 'Drupal\export_import_entities\Form\GenerateSite'
    domaineId: NULL
  requirements:
    _user_is_logged_in: 'TRUE'
  options:
    _admin_route: TRUE
    
export_import_entities.config:
  path: '/export-import-entities/show-site-config'
  defaults:
    _title: 'Get current export'
    _controller: '\Drupal\export_import_entities\Controller\ExportImportEntitiesController::ShowSiteConfig'
  requirements:
    _permission: 'access content'
    _role: 'gerant_de_site_web+administrator'
    
export_import_entities.select_export_entity:
  path: '/admin/export-import-entities/select-export-entity'
  defaults:
    _title: 'Select Export Entity'
    _form: 'Drupal\export_import_entities\Form\SelectExportEntity'
  requirements:
    _permission: 'access content'
    _role: 'administrator'
    
    
